<!-- ============================================================
     LEFT SIDEBAR
     ============================================================ -->
<aside id="left-sidebar"
       class="z-sidebar"
       role="navigation"
       aria-label="Knowledge base navigation">

    <!-- Sidebar Header: Brand -->
    <div class="z-sidebar-brand">
        <a href="/" class="z-brand" aria-label="Zenith Export AI home">
            <div class="z-brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <polyline points="9 12 11 14 15 10"/>
                </svg>
            </div>
            <div class="z-brand-text">
                <span class="z-brand-name">Zenith</span>
                <span class="z-brand-tag">Trade Compliance</span>
            </div>
        </a>
    </div>

    <!-- System Status -->
    <div class="z-sidebar-section">
        <div class="z-status-row">
            <span class="z-status-dot" aria-hidden="true"></span>
            <span class="z-status-text">System Ready</span>
        </div>
        <p class="z-kb-status">
            {{ stats.total_documents }} documents &bull; {{ stats.total_pages }} pages &bull; Last updated: recently
        </p>
    </div>

    <!-- Region Selector -->
    <div class="z-sidebar-section">
        <p class="z-sidebar-label">Region</p>
        <div class="z-region-tabs" role="tablist" aria-label="Select region">
            <button type="button"
                    class="z-region-tab"
                    id="sidebar-region-india"
                    data-region="india"
                    role="tab"
                    aria-selected="false">
                <span class="z-region-flag" aria-hidden="true">🇮🇳</span>
                <span class="z-region-name">India</span>
                <span class="z-region-badge">{{ stats.regions.india }}</span>
                <span class="z-region-key">1</span>
            </button>
            <button type="button"
                    class="z-region-tab"
                    id="sidebar-region-us"
                    data-region="us"
                    role="tab"
                    aria-selected="false">
                <span class="z-region-flag" aria-hidden="true">🇺🇸</span>
                <span class="z-region-name">USA</span>
                <span class="z-region-badge">{{ stats.regions.us }}</span>
                <span class="z-region-key">2</span>
            </button>
            <button type="button"
                    class="z-region-tab"
                    id="sidebar-region-eu"
                    data-region="eu"
                    role="tab"
                    aria-selected="false">
                <span class="z-region-flag" aria-hidden="true">🇪🇺</span>
                <span class="z-region-name">EU</span>
                <span class="z-region-badge">{{ stats.regions.eu }}</span>
                <span class="z-region-key">3</span>
            </button>
            <button type="button"
                    class="z-region-tab"
                    id="sidebar-region-all"
                    data-region=""
                    role="tab"
                    aria-selected="false">
                <span class="z-region-flag" aria-hidden="true">🌐</span>
                <span class="z-region-name">All</span>
                <span class="z-region-badge">{{ stats.total_documents }}</span>
                <span class="z-region-key">4</span>
            </button>
        </div>
    </div>

    <!-- Knowledge Base Browser -->
    <div class="z-sidebar-section z-sidebar-section--grow">
        <div class="z-sidebar-section-header">
            <p class="z-sidebar-label">Documents</p>
            <button type="button"
                    class="z-sidebar-action-btn"
                    aria-label="Upload new document"
                    title="Upload document"
                    id="sidebar-upload-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </button>
        </div>

        <div class="z-doc-search-wrap">
            <input type="text"
                   id="sidebar-doc-search"
                   class="z-doc-search"
                   placeholder="Search documents..."
                   aria-label="Search documents">
            <svg class="z-doc-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </div>

        <div id="sidebar-doc-list" class="z-doc-list" role="list" aria-label="Indexed documents">
            <!-- Documents rendered by sidebar.js -->
        </div>
    </div>

    <!-- Recent Questions -->
    <div class="z-sidebar-section">
        <p class="z-sidebar-label">Recent</p>
        <div id="sidebar-recent-list" class="z-recent-list" role="list" aria-label="Recent questions">
            <!-- Rendered by sidebar.js -->
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="z-sidebar-section z-sidebar-section--actions">
        <button type="button" class="z-quick-action-btn z-quick-action-btn--primary" id="sidebar-upload-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Upload Document
        </button>
        <button type="button" class="z-quick-action-btn" id="sidebar-stats-action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            Statistics
        </button>
    </div>

    <!-- Resize Handle -->
    <div id="sidebar-resize-handle"
         class="z-resize-handle"
         aria-hidden="true"
         title="Resize sidebar">
        <div class="z-resize-handle-inner"></div>
    </div>
</aside>
